{{ define "main_article" }}

<div style="max-width: 600px; margin: 2rem; padding: 2rem 0;">
  <h1>{{ .Title }}</h1>
  <p style="color: #99a1ff; margin-bottom: 2rem; margin-top: 2rem">Ai un gând, o întrebare, sau vrei doar să-mi scrii? Lasă un mesaj mai jos.</p>

  <form action="https://formspree.io/f/xgawnepp" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
    <label>
      Nume
      <input type="text" name="name" required style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; background: #1e2327; border: 1px solid #3a4149; border-radius: 4px; color: #e8e6e3;">
    </label>
    <label>
      Email
      <input type="email" name="email" required style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; background: #1e2327; border: 1px solid #3a4149; border-radius: 4px; color: #e8e6e3;">
    </label>
    <label>
      Mesaj
      <textarea name="message" rows="6" required style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; background: #1e2327; border: 1px solid #3a4149; border-radius: 4px; color: #e8e6e3; font-family: inherit;"></textarea>
    </label>
    <button type="submit" style="padding: 0.7rem 1.5rem; background: #c9a876; border: none; border-radius: 4px; color: #1e2327; font-weight: 500; cursor: pointer; width: fit-content;">
      Trimite
    </button>
  </form>
</div>
{{ end }}
